    <main>
    <section class="conteudo-pagina">
        <h2>Fale Conosco</h2>
        <p>Envie sua mensagem ou dúvida preenchendo o formulário abaixo:</p>

        <!-- Form configurado para recarregar a própria página em HTML puro -->
        <form action="contato.html" method="get">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
            
            <button type="submit">Enviar Mensagem</button>
        </form>
    </section>
</main>
